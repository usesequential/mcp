# Publishes server.json to the official MCP Registry (https://registry.modelcontextprotocol.io).
# Run it by hand: Actions → "Publish to the MCP Registry" → Run workflow.
# The job signs in with GitHub's OIDC token, which proves that it runs in the usesequential organization.
# It needs no secret. A version that is already in the registry is refused: change "version" in server.json first.
name: Publish to the MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher 1.8.9
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Check server.json
        run: ./mcp-publisher validate
      - name: Sign in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
